// ============================================================
// 消息定义
// ============================================================

message ClientInfo {
  string deviceId = 1;
  string deviceName = 2;
  string brand = 3;
  string model = 4;
  string os = 5;
  string osVersion = 6;
  string language = 7;
  string country = 8;
  string timezone = 9;
  string network = 10;
  int32 screenWidth = 11;
  int32 screenHeight = 12;
  string clientVersion = 13;
  string bundleVersion = 14;
  string channel = 15;
  string sdkVersion = 16;
  string packageName = 17;
  string installId = 18;
  bool isEmulator = 19;
}

message ThirdYre {
  int64 t = 1; // Unix 毫秒
  string siteCode = 2;
  string ck = 3;
  string uid = 4;
}

message TextContent {
  int32 type = 1; // 0 纯文本，1 多语言 Key
  string text = 2;
}

message Reward {
  string itemId = 1;
  int64 count = 2;
}

message Article {
  int64 id = 1;
  string title = 2;
  string content = 3;
  int64 createdAt = 4; // Unix 毫秒
  int32 status = 5;
}

message GetHealthReq {
}

message GetHealthResp {
  string status = 1;
  int64 time = 2;
}

message GetVersionReq {
}

