syntax = "proto3";
package openapi;
option go_package = "kemiluo/docs/apifox/openapi";

// 由 docs/apifox/openapi.yaml 转换而来，供 Apifox 按 proto 导入。
// 与 pb/*.proto 分开存放，不参与 gen_proto.sh。
// @http 为 HTTP 方法与路径，@auth 表示是否携带 Bearer JWT，@sign 表示内部签名。

import "google/protobuf/struct.proto";

// 公共接口
service CommonService {
  // 健康检查
  // 目录 公共
  // 服务 GameLogic http://127.0.0.1:8081；Platform http://127.0.0.1:8080；GMT http://127.0.0.1:8082
  // @http GET /health
  // @auth false
  rpc GetHealth(GetHealthReq) returns (GetHealthResp);

  // 版本核对
  // 目录 公共
  // 服务 GameLogic http://127.0.0.1:8081；Platform http://127.0.0.1:8080；GMT http://127.0.0.1:8082
  // @http GET /version
  // @auth false
  rpc GetVersion(GetVersionReq) returns (GetVersionResp);

  // 查询订单
  // 目录 内部/订单
  // 同一路径在两个服务上含义不同，调试时切换 Server。
  // GameLogic 8081：业务订单，过滤字段 status。
  // Platform 8080：渠道支付订单，过滤字段 paymentStatus。
  // 服务 GameLogic 业务订单 http://127.0.0.1:8081；Platform 支付订单 http://127.0.0.1:8080
  // @http GET /gmt/iap/orders
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc GetGmtIapOrders(GetGmtIapOrdersReq) returns (GetGmtIapOrdersResp);
}

// GameLogic，默认 http://127.0.0.1:8081
service GameLogicService {
  // WebSocket 升级
  // 目录 GameLogic/长连接
  // 握手地址 GET /ws?token=JWT。升级成功后帧协议为 cspb.WsMessage。
  // 服务 GameLogic http://127.0.0.1:8081
  // @http GET /ws
  // @auth false
  rpc GetWs(GetWsReq) returns (GetWsResp);

  // 登录
