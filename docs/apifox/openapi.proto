// Platform，默认 http://127.0.0.1:8080
service PlatformService {
  // 充值回调
  // 目录 Platform/充值回调
  // sign = md5(passport + order + key + server + time + agent + money + goodid)。响应是 {code, content}，不是统一信封。
  // 服务 Platform http://127.0.0.1:8080
  // @http GET /pay/notify
  // @auth false
  rpc GetPayNotify(GetPayNotifyReq) returns (GetPayNotifyResp);

  // 充值回调
  // 目录 Platform/充值回调
  // Content-Type 为 application/x-www-form-urlencoded，字段与 GET 相同。
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /pay/notify
  // @auth false
  rpc PayNotify(PayNotifyReq) returns (PayNotifyResp);

  // 单服单角色
  // 目录 Platform/LunPlay
  // ck = md5(passport + t + key + serverCode)，t 为秒。
  // 服务 Platform http://127.0.0.1:8080
  // @http GET /lunplay/role/query
  // @auth false
  rpc GetLunplayRoleQuery(GetLunplayRoleQueryReq) returns (GetLunplayRoleQueryResp);

  // 单服多角色
  // 目录 Platform/LunPlay
  // 服务 Platform http://127.0.0.1:8080
  // @http GET /lunplay/role/list
  // @auth false
  rpc GetLunplayRoleList(GetLunplayRoleListReq) returns (GetLunplayRoleListResp);

  // 按角色 ID 查询
  // 目录 Platform/LunPlay
  // ck = md5(roleid + t + key)。
  // 服务 Platform http://127.0.0.1:8080
  // @http GET /lunplay/role/byRoleId
  // @auth false
  rpc GetLunplayRoleByRoleId(GetLunplayRoleByRoleIdReq) returns (GetLunplayRoleByRoleIdResp);

  // 按角色查区服
  // 目录 Platform/LunPlay
  // 服务 Platform http://127.0.0.1:8080
  // @http GET /lunplay/role/serverList
  // @auth false
  rpc GetLunplayRoleServerList(GetLunplayRoleServerListReq) returns (GetLunplayRoleServerListResp);

  // 创建支付单
  // 目录 Platform/内购内部
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /internal/iap/paymentOrder
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc InternalIapPaymentOrder(InternalIapPaymentOrderReq) returns (InternalIapPaymentOrderResp);

  // 手动补单
  // 目录 Platform/内购内部
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /gmt/iap/replenish
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc GmtIapReplenish(GmtIapReplenishReq) returns (GmtIapReplenishResp);

  // 账号鉴权
  // 目录 Platform/账号内部
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /internal/account/auth
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc InternalAccountAuth(InternalAccountAuthReq) returns (InternalAccountAuthResp);

  // 作废账号
  // 目录 Platform/账号内部
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /internal/account/deactivate
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc InternalAccountDeactivate(InternalAccountDeactivateReq) returns (InternalAccountDeactivateResp);

  // 添加白名单
  // 目录 Platform/充值白名单
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /gmt/whitelist/add
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc GmtWhitelistAdd(GmtWhitelistAddReq) returns (GmtWhitelistAddResp);

  // 删除白名单
  // 目录 Platform/充值白名单
  // 服务 Platform http://127.0.0.1:8080
  // @http POST /gmt/whitelist/delete
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc GmtWhitelistDelete(GmtWhitelistDeleteReq) returns (GmtWhitelistDeleteResp);

  // 白名单列表
  // 目录 Platform/充值白名单
  // 服务 Platform http://127.0.0.1:8080
  // @http GET /gmt/whitelist/list
  // @auth false
  // @sign true  请求头 X-Signature / X-Timestamp / X-Nonce
  rpc GetGmtWhitelistList(GetGmtWhitelistListReq) returns (GetGmtWhitelistListResp);
}

